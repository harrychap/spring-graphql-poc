supergraph:
  listen: 0.0.0.0:4000
  introspection: true

sandbox:
  enabled: true

homepage:
  enabled: false

subscription:
  enabled: true
  mode:
    passthrough:
      subgraphs:
        notifications:
          path: /graphql

cors:
  policies:
    - origins:
        - http://localhost:4000
      allow_credentials: false
